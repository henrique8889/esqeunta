<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Esquenta 31</title><link rel="stylesheet" href="/assets/style.css"></head><body class="login-page"><a class="brand login-brand" href="/cardapio"><span class="brand-mark">31</span><span>ESQUENTA <b>31</b></span></a><form id="loginForm" class="login-card"><span class="eyebrow dark">ACESSO RESTRITO</span><h1>Bem-vindo de volta</h1><p>Entre para gerenciar seu cardápio.</p><label>E-mail<input type="email" name="email" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-btn full">Entrar no painel</button><p id="error" class="form-error"></p><a class="back-link" href="/cardapio">← Voltar ao cardápio</a></form><form id="setupForm" class="login-card" hidden style="margin-top:20px"><span class="eyebrow dark">PRIMEIRO ACESSO</span><h2>Criar conta administrativa</h2><p>Escolha uma senha para o administrador do ESQUENTA 31.</p><label>Nome<input name="name" required maxlength="100" value="ESQUENTA 31"></label><label>E-mail<input name="email" type="email" required readonly value="esquenta31@gmail.com"></label><label>Senha nova (mínimo 10 caracteres)<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>Confirmar senha<input name="confirmPassword" type="password" required minlength="10" autocomplete="new-password"></label><label>Código de configuração<input name="setupToken" type="password" required autocomplete="off" placeholder="Código cadastrado na Vercel"></label><button class="primary-btn full">Criar administrador</button><p id="setupError" class="form-error" role="alert"></p></form><script src="/assets/login.js"></script></body></html>
