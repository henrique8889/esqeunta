name: Extract ESQUENTA 31 project
on:
  workflow_dispatch:
  push:
    paths:
      - 'esquenta31-deploy.zip'
      - '.github/workflows/unpack.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project files
        run: |
          set -euo pipefail
          unzip -oq esquenta31-deploy.zip -d /tmp/esquenta31-extracted
          test -f /tmp/esquenta31-extracted/esquenta31/package.json
          cp -R /tmp/esquenta31-extracted/esquenta31/. .
          git status --short
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy extracted ESQUENTA 31 application"
            git push
          fi
