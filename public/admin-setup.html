<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar administrador | ESQUENTA 31</title><link rel="stylesheet" href="/assets/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.setup-card{width:min(100%,460px);background:#171717;border:1px solid #333;border-radius:18px;padding:30px}.setup-card h1{margin:0 0 8px}.setup-card p{color:#aaa;line-height:1.5}.setup-card label{display:block;margin:16px 0 6px}.setup-card input{width:100%;padding:13px;border:1px solid #444;border-radius:9px;background:#0d0d0d;color:white}.setup-card button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:#e85b24;color:white;font-weight:700;cursor:pointer}.hint{font-size:13px;color:#aaa}.error{color:#ff8a70}</style></head><body><main class="setup-card"><h1>ESQUENTA 31</h1><p>Crie o primeiro acesso administrativo. Esta etapa só fica disponível enquanto não existir um administrador cadastrado.</p><form id="setupForm"><label>Nome</label><input name="name" value="ESQUENTA 31" required><label>E-mail</label><input name="email" type="email" value="esquenta31@gmail.com" required><label>Senha</label><input name="password" type="password" minlength="10" required><label>Código de configuração</label><input name="setupToken" type="password" required><p class="hint">Use o código temporário fornecido durante a configuração do projeto.</p><p id="error" class="error" role="alert"></p><button type="submit">Criar administrador</button></form></main><script>
const form=document.querySelector('#setupForm');
(async()=>{const r=await fetch('/api/auth/setup-status');const j=await r.json();if(!j.setupRequired){location.replace('/admin/login')}})();
form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok){document.querySelector('#error').textContent=j.error||'Não foi possível configurar.';return}location.href='/admin'});
</script></body></html>
